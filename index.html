<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>😸Cat-Fact-Check</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="content-wrap">
      <div class="card">
        <button class="heart-btn"><i class="fa-regular fa-heart"></i></button>
        <div class="heading">Did you know?</div>
        <div class="fact"><p></p></div>
        <div class="btn">
          <button>
            <i class="fa-solid fa-arrows-rotate"></i> Get new facts
          </button>
        </div>
      </div>
      <div class="fav-box">
        <p class="fav-heading"><i class="fa-solid fa-paw"></i>Saved Facts</p>
        <ul class="fav-list"></ul>
      </div>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>
